name: build-and-release

# Build the CLI + GUI on all three OSes on every push/PR, and attach binaries to
# a GitHub Release when a version tag (v*) is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which also runs on pull_request) stays read-only;
# only the release job is granted write access to publish the Release.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            ext: ".exe"
            archive: zip
          - os: ubuntu-latest
            name: linux-x64
            ext: ""
            archive: tar
          # Both macOS architectures are built on the Apple Silicon runner
          # (x86_64 cross-compiled) — GitHub's Intel macOS runners have long,
          # unreliable queues.
          - os: macos-latest
            name: macos
            ext: ""
            archive: tar
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # serialport -> libudev; eframe/egui (glow + winit) -> X11/Wayland + GL
          sudo apt-get install -y pkg-config libudev-dev \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (release, native)
        run: cargo build --release

      - name: Build macOS x86_64 (cross-compiled on Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package
        shell: bash
        run: |
          package() {
            name="$1"; bindir="$2"; stage="itec-bridge-$name"
            mkdir "$stage"
            cp "$bindir/itec-bridge${{ matrix.ext }}" "$stage"/
            cp "$bindir/itec-bridge-gui${{ matrix.ext }}" "$stage"/
            cp README.md LICENSE "$stage"/ 2>/dev/null || true
            if [ "${{ matrix.archive }}" = "zip" ]; then
              7z a "$stage.zip" "$stage" >/dev/null
            else
              tar czf "$stage.tar.gz" "$stage"
            fi
          }
          if [ "${{ runner.os }}" = "macOS" ]; then
            package "macos-arm64" "target/release"
            package "macos-x64"   "target/x86_64-apple-darwin/release"
          else
            package "${{ matrix.name }}" "target/release"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: itec-bridge-${{ matrix.name }}
          path: |
            itec-bridge-*.zip
            itec-bridge-*.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
